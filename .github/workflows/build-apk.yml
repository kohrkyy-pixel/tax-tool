name: Build Android APK

# index.html(세무 툴)이나 android 폴더가 바뀌면 자동으로 APK를 새로 만든다.
# Actions 탭에서 [Run workflow] 버튼으로 수동 실행도 가능.
on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Put the tax tool (index.html) into the app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: Restore signing key
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/CambodiaTax-v1.0.${{ github.run_number }}.apk"
          ls -la dist

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: CambodiaTax-v1.0.${{ github.run_number }}
          path: dist/*.apk

      - name: Publish to Releases (휴대폰에서 바로 다운로드)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: CambodiaTax APK v1.0.${{ github.run_number }}
          body: |
            캄보디아 세무신고 관리 앱 (Android)
            휴대폰에서 아래 .apk 파일을 눌러 설치하세요.
          files: dist/*.apk
          make_latest: true
