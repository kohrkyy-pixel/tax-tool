  var prefix = "ctt:";
  function key(k, shared) {
    return prefix + (shared ? "shared:" : "user:") + k;

    get: function (k, shared) {

        key: k,
        value: v,
        shared: !!shared
      });
    },
    set: function (k, value, shared) {
      localStorage.setItem(key(k, shared), value);
      return Promise.resolve({
        key: k,
        value: value,
        shared: !!shared
      });
    },
    delete: function (k, shared) {
      localStorage.removeItem(key(k, shared));
      return Promise.resolve({
        key: k,

        shared: !!shared

    list: function (p, shared) {

   3) 배포 → 새 배포 → 유형: 웹 앱
      · 실행 계정: 나
      · 액세스 권한: 모든 사용자
   4) 생성된 웹 앱 URL을 아래 GAS_WEB_APP_URL 에 붙여넣기
   5) GAS_PASSPHRASE 에 사무실 공용 암호를 정해 넣고, Apps Script 코드의
      PASSPHRASE 값도 같게 맞추기

   ── 방법 B. Supabase (설정 복잡 · 직원별 로그인 지원) ──────
   1) supabase.com 에서 무료 프로젝트 생성
   2) SQL Editor에서 아래 스크립트 실행:

      create table if not exists tax_app_state (
        workspace_id text primary key,
        data jsonb not null,
        updated_at timestamptz not null default now()
      );
      alter table tax_app_state enable row level security;
      create policy "authenticated access" on tax_app_state
        for all to authenticated using (true) with check (true);

   3) Authentication → Providers → Email 활성화,
      Authentication → Sign In / Providers 에서 "Allow new users to sign up"을 끄고
      직원 계정은 Authentication → Users 에서 직접 생성(Invite)
   4) Project Settings → API 에서 Project URL 과 anon public key 복사
   5) 아래 SUPABASE_* 두 상수에 붙여넣기
   ------------------------------------------------------------ */

const GAS_PASSPHRASE = ""; // 비워두면 실행할 때마다 암호를 입력받습니다 (권장)

// 방법 B — Supabase

// 코드 상수 + 앱 내 설정을 합쳐 최종 백엔드 설정을 결정 (앱 내 설정이 우선)
function resolveBackendConfig(override) {
  const mode = override?.mode || (override?.gasUrl ? "gsheet" : GAS_WEB_APP_URL ? "gsheet" : "supabase");
  const workspaceId = (override?.workspaceId || WORKSPACE_ID || "default").trim();
  if (mode === "gsheet") {
    const gasUrl = (override?.gasUrl || GAS_WEB_APP_URL || "").trim();
    const passphrase = (override?.passphrase ?? GAS_PASSPHRASE ?? "").trim();
    return {
      mode: "gsheet",
      gasUrl,
      passphrase,
      workspaceId,
      enabled: Boolean(gasUrl),
      url: "",
      anonKey: ""
    };
  }
  const url = (override?.url || SUPABASE_URL || "").trim().replace(/\/+$/, "");
  const anonKey = (override?.anonKey || SUPABASE_ANON_KEY || "").trim();
  return {
    mode: "supabase",
    url,
    anonKey,
    workspaceId,
    enabled: Boolean(url && anonKey),
    gasUrl: "",
    passphrase: ""
  };
}

function isEmbedded() {
  try {
    return window.self !== window.top;
  } catch (e) {
    return true; // 접근 자체가 차단되면 iframe 안이라는 뜻
  }
}

/* ---------- Google 스프레드시트 백엔드 (Apps Script 웹앱) ----------
   Content-Type을 text/plain으로 보내 CORS 사전요청(preflight)을 피한다.
   Apps Script 웹앱은 단순 POST 요청에는 CORS 허용 헤더를 붙여 응답한다. */

async function gasRequest(cfg, action, data) {
  const url = (cfg.gasUrl || "").trim();
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url)) {
    throw new Error("웹 앱 URL 형식이 올바르지 않습니다. https://script.google.com/macros/s/.../exec 형태여야 하며 /exec 로 끝나야 합니다 (/dev 주소는 사용할 수 없습니다).");
  }
  let res;
  try {
    res = await fetch(url, {
      method: "POST",
      // text/plain 으로 보내 CORS 사전요청(preflight)을 피한다
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      redirect: "follow",
      body: JSON.stringify({
        action,
        workspaceId: cfg.workspaceId,
        passphrase: cfg.passphrase || "",
        data
      })
    });
  } catch (e) {
    if (isEmbedded()) {
      throw new Error("미리보기 창에서는 외부 연결이 차단됩니다. 이 파일을 컴퓨터에 내려받은 뒤 파일을 직접 열어주세요 (주소창이 file:/// 로 시작해야 합니다).");
    }
    throw new Error("연결할 수 없습니다 (Failed to fetch). ① 배포 시 '액세스 권한'이 '모든 사용자'인지, ② 코드 수정 후 '새 배포'로 다시 배포했는지, ③ URL이 잘리지 않았는지 확인하세요. 브라우저에서 이 URL을 직접 열었을 때 화면이 나오면 배포는 정상입니다.");
  }
  if (!res.ok) throw new Error(`요청 실패 (${res.status}) — 배포 설정을 확인하세요.`);
  const text = await res.text();
  let json;
  try {
    json = JSON.parse(text);
  } catch (e) {
    if (text.includes("<!DOCTYPE") || text.includes("<html")) {
      throw new Error("스크립트 대신 로그인/오류 페이지가 반환되었습니다. 배포의 '액세스 권한'을 '모든 사용자'로 바꾼 뒤 새 배포를 만들어 주세요.");
    }
    throw new Error("응답을 읽을 수 없습니다 — 스크립트 코드가 올바르게 붙여넣어졌는지 확인하세요.");
  }
  if (json.error === "NO_BODY") {
    throw new Error("요청 본문이 서버에 도착하지 않았습니다. 브라우저를 바꿔서 시도해 보세요 (Chrome 권장).");
  }
  if (json.error === "UNAUTHORIZED") {
    const sent = (cfg.passphrase || "").length;
    // 서버가 최신 코드라면 진단 정보를 함께 보내준다
    if (typeof json.receivedLength === "number") {
      if (json.receivedLength === 0) {
        throw new Error("서버에 암호가 전달되지 않았습니다(0자). 브라우저를 바꿔서 시도해 보세요 (Chrome 권장).");
      }
      if (json.receivedLength !== sent) {
        throw new Error(`전송 중 암호가 변형되었습니다 — 입력 ${sent}자 → 서버 수신 ${json.receivedLength}자. 브라우저를 바꿔서 시도해 보세요.`);
      }
      if (json.receivedLength !== json.expectedLength) {
        throw new Error(`암호가 다릅니다 — 입력 ${sent}자, 스크립트에 설정된 값은 ${json.expectedLength}자입니다. 스크립트의 PASSPHRASE를 확인하세요.`);
      }
      throw new Error(`암호가 일치하지 않습니다 (길이는 같음). 서버가 받은 문자코드: ${json.receivedCodes}. 앞뒤 공백이나 유사문자를 확인하세요.`);
    }
    if (json.version && json.version !== "v3-summary") {
      throw new Error("배포된 스크립트가 최신이 아닙니다. [배포 → 배포 관리 → 편집 → 버전: 새 버전 → 배포]를 실행하세요.");
    }
    throw new Error("AUTH_REQUIRED");
  }
  if (json.error) throw new Error(json.error);
  return json;
}

/* ---------- Supabase Auth (직원별 로그인) ---------- */

async function authRequest(cfg, path, body, token) {
  const res = await fetch(`${cfg.url}/auth/v1/${path}`, {
    method: "POST",
    headers: {
      apikey: cfg.anonKey,
      "Content-Type": "application/json",
      ...(token ? {
        Authorization: `Bearer ${token}`
      } : {})
    },
    body: body ? JSON.stringify(body) : undefined
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(json.error_description || json.msg || json.message || `요청 실패 (${res.status})`);
  }
  return json;
}
async function authSignIn(cfg, email, password) {
  const json = await authRequest(cfg, "token?grant_type=password", {
    email,
    password
  });
  return {
    accessToken: json.access_token,
    refreshToken: json.refresh_token,
    expiresAt: Date.now() + (json.expires_in || 3600) * 1000,
    email: json.user?.email || email,
    userId: json.user?.id || null
  };
}
async function authSignUp(cfg, email, password) {
  const json = await authRequest(cfg, "signup", {
    email,
    password
  });
  // 이메일 확인이 켜져 있으면 access_token 없이 사용자만 생성됨
  if (!json.access_token) return {
    needsConfirmation: true,
    email
  };
  return {
    accessToken: json.access_token,
    refreshToken: json.refresh_token,
    expiresAt: Date.now() + (json.expires_in || 3600) * 1000,
    email: json.user?.email || email,
    userId: json.user?.id || null
  };
}
async function authRefresh(cfg, refreshToken) {
  const json = await authRequest(cfg, "token?grant_type=refresh_token", {
    refresh_token: refreshToken
  });
  return {
    accessToken: json.access_token,
    refreshToken: json.refresh_token,
    expiresAt: Date.now() + (json.expires_in || 3600) * 1000,
    email: json.user?.email || null,
    userId: json.user?.id || null
  };
}
async function authSignOut(cfg, token) {
  try {
    await authRequest(cfg, "logout", null, token);
  } catch (e) {
    // 서버 세션 만료 등 — 로컬 세션만 지워도 로그아웃 처리됨
  }
}

// 만료가 임박한(60초 이내) 토큰은 자동 갱신
async function ensureFreshSession(cfg, session) {
  if (!session) return null;
  if (session.expiresAt - Date.now() > 60000) return session;
  if (!session.refreshToken) return null;
  const next = await authRefresh(cfg, session.refreshToken);
  return {
    ...session,
    ...next,
    email: next.email || session.email
  };
}

// Supabase REST(PostgREST)를 fetch로 직접 호출 — 별도 SDK 없이 동작
// 로그인 세션이 있으면 사용자 토큰으로, 없으면 anon key로 요청 (RLS 정책에 따라 접근 제어)
function restHeaders(cfg, accessToken) {
  return {
    apikey: cfg.anonKey,
    Authorization: `Bearer ${accessToken || cfg.anonKey}`
  };
}
async function supabaseLoad(cfg, accessToken) {
  const res = await fetch(`${cfg.url}/rest/v1/tax_app_state?workspace_id=eq.${encodeURIComponent(cfg.workspaceId)}&select=data,updated_at`, {
    headers: restHeaders(cfg, accessToken)
  });
  if (res.status === 401 || res.status === 403) throw new Error("AUTH_REQUIRED");
  if (!res.ok) throw new Error(`불러오기 실패 (${res.status})`);
  const rows = await res.json();
  if (!rows.length) return null;
  return {
    data: rows[0].data,
    updatedAt: rows[0].updated_at
  };
}
async function supabaseSave(cfg, data, accessToken) {
  const res = await fetch(`${cfg.url}/rest/v1/tax_app_state?on_conflict=workspace_id`, {
    method: "POST",
    headers: {
      ...restHeaders(cfg, accessToken),
      "Content-Type": "application/json",
      Prefer: "resolution=merge-duplicates,return=representation"
    },
    body: JSON.stringify({
      workspace_id: cfg.workspaceId,
      data,
      updated_at: new Date().toISOString()
    })
  });
  if (res.status === 401 || res.status === 403) throw new Error("AUTH_REQUIRED");
  if (!res.ok) {
    const body = await res.text();
    throw new Error(`저장 실패 (${res.status}) ${body.slice(0, 120)}`);
  }
  return true;
}

// 원천세 세전(총지급액)/세후(실지급액) 입력 모드에 따라 세전 금액을 역산 — 단일세율이므로 나눗셈으로 간단히 역산 가능
function withholdingAmountsFromEntry({
  amountUSD,
  mode,
  category,
  rate
}) {
  const catRate = withholdingRate(category);
  const enteredKHR = (Number(amountUSD) || 0) * rate;
  const grossKHR = mode === "net" ? enteredKHR / (1 - catRate) : enteredKHR;
  const taxKHR = grossKHR * catRate;
  const netKHR = grossKHR - taxKHR;
  return {
    grossKHR,
    taxKHR,
    netKHR,
    catRate
  };
}
function withholdingTotals(list) {
  const items = list || [];
  const totalBaseKHR = items.reduce((s, w) => s + (Number(w.amountKHR) || 0), 0);
  const totalTaxKHR = items.reduce((s, w) => s + (Number(w.taxKHR) || 0), 0);
  return {
    totalBaseKHR,
    totalTaxKHR
  };
}

// NSSF(사회보장기금) — 직원 8인 이상 사업장 의무가입, 매월 급여와 함께 신고·납부 (익월 15일까지)
// 기여기준임금(Contributory Wage): 실제 총급여를 40만~120만 KHR 사이로 상하한 적용 (Sub-Decree No.144, Prakas No.449)
const NSSF_WAGE_MIN = 400000;
const NSSF_WAGE_MAX = 1200000;
const NSSF_RATES = {
  occupationalRiskEmployer: 0.008,
  // 직업재해 (고용주 전액 부담)
  healthcareEmployer: 0.013,
  // 건강보험 (고용주 분)
  healthcareEmployee: 0.013,
  // 건강보험 (근로자 분, 급여에서 원천공제)
  pensionEmployer: 0.02,
  // 연금 (고용주 분)
  pensionEmployee: 0.02 // 연금 (근로자 분, 급여에서 원천공제)
};
function nssfContributoryWageKHR(grossKHR) {
  const g = Number(grossKHR) || 0;
  if (g <= 0) return 0;
  return Math.min(Math.max(g, NSSF_WAGE_MIN), NSSF_WAGE_MAX);
}
function calcEmployeeNssf(e, rate) {
  const grossKHR = employeeGrossKHR(e, rate);
  const wage = nssfContributoryWageKHR(grossKHR);
  const employerOR = wage * NSSF_RATES.occupationalRiskEmployer;
  const employerHealthcare = wage * NSSF_RATES.healthcareEmployer;
  const employeeHealthcare = wage * NSSF_RATES.healthcareEmployee;
  const employerPension = wage * NSSF_RATES.pensionEmployer;
  const employeePension = wage * NSSF_RATES.pensionEmployee;
  const employerTotal = employerOR + employerHealthcare + employerPension;
  const employeeTotal = employeeHealthcare + employeePension;
  return {
    wage,
    employerOR,
    employerHealthcare,
    employeeHealthcare,
    employerPension,
    employeePension,
    employerTotal,
    employeeTotal,
    grandTotal: employerTotal + employeeTotal
  };
}
function calcNssfTotals(employees, rate) {
  return (employees || []).reduce((acc, e) => {
    const n = calcEmployeeNssf(e, rate);
    acc.employerTotal += n.employerTotal;
    acc.employeeTotal += n.employeeTotal;
    acc.grandTotal += n.grandTotal;
    return acc;
  }, {
    employerTotal: 0,
    employeeTotal: 0,
    grandTotal: 0
  });
}

// 공공조명세(Public Lighting Tax) — 주류·담배의 국내 최초 공급(생산/수입 후 첫 공급) 가액의 5% (Prakas No.168 MEF.Prk.GDT)
const PLT_RATE = 0.05;

// 양도소득세(Capital Gains Tax, Prakas No.496 MEF.PrK) — 순차익의 20% 단일세율
// 부동산 외 자산(주식·리스·영업권·지식재산권·외화)은 2026.1.1부터, 부동산은 2027.1.1부터 시행 예정 (2026.1 GDT Instruction No.041 기준, 계속 유예되어 온 항목이므로 시행 여부를 최신 GDT 고시로 재확인 필요)
const CGT_RATE = 0.2;
const CGT_ASSET_TYPES = [{
  id: "shares",
  ko: "주식/지분 (투자자산)",
  en: "Shares / investment assets",
  effective: "2026-01-01"
}, {
  id: "lease",
  ko: "리스 (임차권)",
  en: "Lease",
  effective: "2026-01-01"
}, {
  id: "goodwill",
  ko: "영업권",
  en: "Business goodwill",
  effective: "2026-01-01"
}, {
  id: "ip",
  ko: "지식재산권",
  en: "Intellectual property",
  effective: "2026-01-01"
}, {
  id: "forex",
  ko: "외화",
  en: "Foreign currency",

  ko: "부동산 (토지/건물)",
  en: "Immovable property (land/building)",
  effective: "2027-01-01"
}];
function cgtAssetLabel(id, lang) {
  const found = CGT_ASSET_TYPES.find(a => a.id === id);
  if (!found) return id;
  return lang === "en" ? found.en : found.ko;
}
function cgtEffectiveDate(id) {
  const found = CGT_ASSET_TYPES.find(a => a.id === id);
  return found ? found.effective : "";
}
// method: "actual" (실제 취득원가+부대비용 차감) | "deemed" (취득원가 미확인 시 이전가액의 80%를 취득원가로 간주 — 부동산에 한해 실무상 사용)
function calcCapitalGain(entry) {
  const transferPrice = Number(entry.transferPrice) || 0;
  const acquisitionCost = Number(entry.acquisitionCost) || 0;
  const expenses = Number(entry.expenses) || 0;
  const costBasis = entry.method === "deemed" ? transferPrice * 0.8 : acquisitionCost + expenses;
  const gain = Math.max(transferPrice - costBasis, 0);
  const tax = gain * CGT_RATE;
  return {
    transferPrice,
    costBasis,
    gain,
    tax
  };
}
function calcSalaryTax(gross) {
  const g = Number(gross) || 0;
  let tax = 0;
  for (const b of SALARY_BRACKETS) {
    if (g > b.lo) {
      tax += (Math.min(g, b.hi) - b.lo) * b.rate;
    }
  }
  return Math.round(tax);
}

// 개인별 급여세 신고 명세서용 구간별 상세 계산
function calcSalaryBreakdown(grossKHR) {
  const g = Number(grossKHR) || 0;
  const rows = [];
  let totalTax = 0;
  for (const b of SALARY_BRACKETS) {
    const taxable = g > b.lo ? Math.min(g, b.hi) - b.lo : 0;
    const tax = Math.round(taxable * b.rate);
    if (b.rate === 0 || taxable > 0) {
      rows.push({
        lo: b.lo,
        hi: b.hi,
        rate: b.rate,
        taxable,
        tax
      });
    }
    totalTax += tax;
  }
  return {
    rows,
    totalTax: Math.round(totalTax),
    gross: g,
    net: Math.round(g - totalTax)
  };
}

// 세후(net) 금액에서 세전(gross) 금액을 역산 — 구간별로 선형이므로 구간을 찾아 역함수 적용
function grossFromNet(netKHR) {
  const net = Number(netKHR) || 0;
  if (net <= 0) return 0;
  for (const b of SALARY_BRACKETS) {
    const netAtHi = b.hi === Infinity ? Infinity : b.hi - calcSalaryTax(b.hi);
    if (net <= netAtHi) {
      const taxAtLo = calcSalaryTax(b.lo);
      return (net - b.rate * b.lo + taxAtLo) / (1 - b.rate);
    }
  }
  return net;
}

// 직원 입력값(세전 또는 세후, USD)과 환율로부터 세전 총급여(KHR)를 계산
function employeeGrossKHR(e, rate) {
  const enteredKHR = (Number(e.gross) || 0) * rate;
  return e.mode === "net" ? grossFromNet(enteredKHR) : enteredKHR;
}
function evidenceTotals(evidence) {
  const list = evidence || [];
  const totalExpenseKHR = list.reduce((s, e) => s + (Number(e.amountKHR) || 0), 0);
  const totalVatKHR = list.reduce((s, e) => s + (e.isVatInvoice ? Number(e.vatAmountKHR) || 0 : 0), 0);
  return {
    totalExpenseKHR,
    totalVatKHR
  };
}
const DEFAULT_EXCHANGE_RATE = 4100;
const VAT_RATE = 0.1;
function getRate(f) {
  return Number(f?.exchangeRate) || DEFAULT_EXCHANGE_RATE;
}

// 공급가액(USD) 입력 시 VAT 10%를 자동 계산해 총금액까지 함께 보여주기 위한 헬퍼
function vatBreakdown(supplyUSD, rate) {
  const supply = Number(supplyUSD) || 0;
  const vat = supply * VAT_RATE;
  const total = supply + vat;
  return {
    supplyUSD: supply,
    vatUSD: vat,
    totalUSD: total,
    supplyKHR: supply * rate,
    vatKHR: vat * rate,
    totalKHR: total * rate
  };
}
function calcMonthly(f) {
  const rate = getRate(f);
  const revenue = vatBreakdown(f?.revenue, rate);
  const purchase = vatBreakdown(f?.purchase, rate);
  const employees = f?.employees || [];
  const {
    totalExpenseKHR,
    totalVatKHR
  } = evidenceTotals(f?.evidence);
  const {
    totalTaxKHR: withholdingTaxTotal,
    totalBaseKHR: withholdingBaseTotal
  } = withholdingTotals(f?.withholding);
  const expensesManualKHR = (Number(f?.expenses) || 0) * rate;
  const inputVAT = purchase.vatKHR + totalVatKHR;
  const totalExpenses = expensesManualKHR + purchase.supplyKHR + totalExpenseKHR;
  const outputVAT = revenue.vatKHR;
  const vatPayable = Math.max(outputVAT - inputVAT, 0);
  const ppt = revenue.supplyKHR * 0.01;
  const pltBaseKHR = (Number(f?.alcoholTobaccoRevenue) || 0) * rate;
  const plt = pltBaseKHR * PLT_RATE;
  const salaryTaxTotal = employees.reduce((s, e) => s + calcSalaryTax(employeeGrossKHR(e, rate)), 0);
  const nssf = calcNssfTotals(employees, rate);
  const totalDue = vatPayable + ppt + plt + salaryTaxTotal + withholdingTaxTotal;
  return {
    rate,
    revenue,
    purchase,
    revenueKHR: revenue.supplyKHR,
    outputVAT,
    vatPayable,
    ppt,
    pltBaseKHR,
    plt,
    salaryTaxTotal,
    withholdingTaxTotal,
    withholdingBaseTotal,
    nssfEmployerTotal: nssf.employerTotal,
    nssfEmployeeTotal: nssf.employeeTotal,
    nssfGrandTotal: nssf.grandTotal,
    totalDue,
    inputVAT,
    totalExpenses,
    evidenceVat: totalVatKHR,
    evidenceExpense: totalExpenseKHR
  };
}
function calcAnnual(filingsForClient, year) {
  let revenue = 0,
    expenses = 0,
    pptPaid = 0,
    withholdingPaid = 0,
    nssfPaid = 0,
    monthsFiled = 0;
  for (let m = 1; m <= 12; m++) {
    const key = `${year}-${String(m).padStart(2, "0")}`;
    const f = filingsForClient?.[key];
    if (f) {
      const monthly = calcMonthly(f);
      revenue += monthly.revenueKHR;
      expenses += monthly.totalExpenses;
      pptPaid += monthly.ppt;
      withholdingPaid += monthly.withholdingTaxTotal;
      nssfPaid += monthly.nssfGrandTotal;
      monthsFiled++;
    }
  }
  const profit = revenue - expenses;
  const incomeTax = profit > 0 ? profit * 0.2 : 0;
  const minTax = revenue * 0.01;
  const annualToiDue = Math.max(incomeTax, minTax);
  const balance = annualToiDue - pptPaid;
  return {
    revenue,
    expenses,
    profit,
    incomeTax,
    minTax,
    annualToiDue,
    pptPaid,
    withholdingPaid,
    nssfPaid,
    balance,
    monthsFiled
  };
}

// 월별 손익계산서: 매출액 - 매입원가 = 매출총이익, - 급여(고용주 NSSF 부담분 포함)·기타경비 = 영업이익
function calcIncomeStatement(f) {
  const m = calcMonthly(f);
  const rate = m.rate;
  const employees = f?.employees || [];
  const grossPayroll = employees.reduce((s, e) => s + employeeGrossKHR(e, rate), 0);
  const payroll = grossPayroll + m.nssfEmployerTotal; // 총급여 + 고용주 NSSF 부담분(직업재해+건강보험+연금) = 실제 인건비 총액
  const expensesManualKHR = (Number(f?.expenses) || 0) * rate;
  const revenue = m.revenue.supplyKHR;
  const cogs = m.purchase.supplyKHR;
  const grossProfit = revenue - cogs;
  const opex = expensesManualKHR + m.evidenceExpense;
  const operatingProfit = grossProfit - payroll - opex;
  return {
    rate,
    revenue,
    cogs,
    grossProfit,
    payroll,
    opex,
    operatingProfit,
    ppt: m.ppt
  };
}

// 연간 손익계산서: 월별 입력분을 급여를 포함한 발생주의 방식으로 합산, 세금은 연간 ToI 확정세액을 반영
function calcAnnualIncomeStatement(filingsForClient, year) {
  let revenue = 0,
    cogs = 0,
    payroll = 0,
    opex = 0,
    monthsFiled = 0,
    lastRate = DEFAULT_EXCHANGE_RATE;
  const monthly = [];
  for (let mo = 1; mo <= 12; mo++) {
    const key = monthKey(year, mo);
    const f = filingsForClient?.[key];
    if (f) {
      const is = calcIncomeStatement(f);
      revenue += is.revenue;
      cogs += is.cogs;
      payroll += is.payroll;
      opex += is.opex;
      monthsFiled++;
      lastRate = is.rate;
      monthly.push({
        month: mo,
        ...is
      });
    }
  }
  const grossProfit = revenue - cogs;
  const operatingProfit = grossProfit - payroll - opex;
  const annualTax = calcAnnual(filingsForClient, year);
  const netIncome = operatingProfit - annualTax.annualToiDue;
  return {
    revenue,
    cogs,
    grossProfit,
    payroll,
    opex,
    operatingProfit,
    monthsFiled,
    monthly,
    rate: lastRate,
    annualToiDue: annualTax.annualToiDue,
    pptPaid: annualTax.pptPaid,
    netIncome
  };
}
function fmt(n) {
  const v = Math.round(Number(n) || 0);
  return v.toLocaleString("en-US");
}
function fmtUsd(n) {
  const v = Number(n) || 0;
  return v.toLocaleString("en-US", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

// 손익계산서용 — 선택된 통화(KHR/USD)에 맞춰 한 가지 금액만 표기
function fmtByCcy(khr, rate, currency) {
  const v = Number(khr) || 0;
  const r = Number(rate) || DEFAULT_EXCHANGE_RATE;
  return currency === "USD" ? `$${fmtUsd(v / r)}` : `${fmt(v)} KHR`;
}
function monthKey(y, m) {
  return `${y}-${String(m).padStart(2, "0")}`;
}
function prevMonthKey(y, m) {
  return m === 1 ? monthKey(y - 1, 12) : monthKey(y, m - 1);
}

// 신규 월 신고서 생성 시, 가장 최근 과거 월(최대 24개월 전까지 탐색)에 등록된 직원 명단을 기본값으로 이월
function carryForwardEmployees(filingsForClient, year, month) {
  let y = year,
    m = month;
  for (let i = 0; i < 24; i++) {
    m -= 1;
    if (m < 1) {
      m = 12;
      y -= 1;
    }
    const f = filingsForClient?.[monthKey(y, m)];
    if (f && Array.isArray(f.employees) && f.employees.length > 0) {
      return f.employees.map(e => ({
        id: uid(),
        name: e.name || "",
        gross: e.gross || "",
        mode: e.mode || "gross"
      }));
    }
  }
  return [];
}
function uid() {
  return Math.random().toString(36).slice(2, 10);
}

// 업로드한 증빙 이미지를 저장소 용량 절약을 위해 축소 후 base64로 변환
function fileToResizedDataUrl(file, maxWidth = 480, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("파일을 읽지 못했습니다"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("이미지를 불러오지 못했습니다"));
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Claude API(Sonnet)로 증빙 이미지를 분류: 계정과목/거래처/금액/통화/부가세 여부 추출
async function classifyReceipt({
  dataUrl,
  description,
  evidenceType,
  exchangeRate
}) {
  const base64 = dataUrl.split(",")[1];
  const mediaType = dataUrl.substring(5, dataUrl.indexOf(";"));
  const categoryList = EXPENSE_CATEGORIES.map(c => `${c.id} (${c.ko} / ${c.en})`).join(", ");
  const instruction = `You are an accounting assistant classifying expense receipts for a business in Cambodia. "category" must be exactly one of the id tokens below.
Evidence type (set by user): ${evidenceType === "vat" ? "Tax invoice (VAT-creditable)" : "General expense receipt (not VAT-creditable)"}
User note: ${description || "(none)"}

Valid category ids: ${categoryList}

Look at the image and reply with ONLY raw JSON, no markdown fences, no extra text:
{
  "category": "exactly one id token from the list above",
  "vendor": "vendor/merchant name (empty string if unreadable)",
  "amount": number only, no currency symbol,
  "currency": "KHR or USD",
  "vatAmount": if this is a tax invoice, the VAT amount as a number (estimate as amount * 10/110 if not explicitly shown); otherwise 0,
  "summary_ko": "one short summary sentence written in Korean",
  "summary_en": "the same summary sentence written in English (not a translation note — a natural English sentence)"
}`;
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{
        role: "user",
        content: [{
          type: "image",
          source: {
            type: "base64",
            media_type: mediaType,
            data: base64
          }
        }, {
          type: "text",
          text: instruction
        }]
      }]
    })
  });
  const data = await response.json();
  const textBlock = (data.content || []).find(b => b.type === "text");
  if (!textBlock) throw new Error("No classification response received");
  const cleaned = textBlock.text.replace(/```json|```/g, "").trim();
  const parsed = JSON.parse(cleaned);
  const rate = Number(exchangeRate) || DEFAULT_EXCHANGE_RATE;
  const amountKHR = parsed.currency === "USD" ? Math.round((Number(parsed.amount) || 0) * rate) : Math.round(Number(parsed.amount) || 0);
  const vatAmountKHR = parsed.currency === "USD" ? Math.round((Number(parsed.vatAmount) || 0) * rate) : Math.round(Number(parsed.vatAmount) || 0);
  const validIds = EXPENSE_CATEGORIES.map(c => c.id);
  return {
    category: validIds.includes(parsed.category) ? parsed.category : "other",
    vendor: parsed.vendor || "",
    amount: Number(parsed.amount) || 0,
    currency: parsed.currency === "USD" ? "USD" : "KHR",
    amountKHR,
    vatAmountKHR: evidenceType === "vat" ? vatAmountKHR : 0,
    summaryKo: parsed.summary_ko || parsed.summary || "",
    summaryEn: parsed.summary_en || ""
  };
}

// 내부검증: 신고 전 직원이 놓치기 쉬운 항목을 점검
function validateFiling(filing, client, prevFiling, lang) {
  const t = (ko, en) => lang === "en" ? en : ko;
  const issues = [];
  const revenue = Number(filing?.revenue) || 0;
  const purchase = Number(filing?.purchase) || 0;
  const employees = filing?.employees || [];
  if (!client?.tin) {
    issues.push({
      level: "warning",
      msg: t("고객사 TIN(사업자등록번호)이 등록되어 있지 않습니다.", "Client TIN (tax ID) is not registered.")
    });
  }
  if (revenue === 0 && employees.length === 0 && purchase === 0) {
    issues.push({
      level: "info",
      msg: t("이번 기간 데이터가 아직 입력되지 않았습니다.", "No data has been entered for this period yet.")
    });
  }
  if (revenue > 0 && purchase > revenue) {
    issues.push({
      level: "warning",
      msg: t("매입액이 매출액보다 큽니다 — 환급/이월 대상인지 확인하세요.", "Purchases exceed revenue — check whether this qualifies for VAT refund/carryforward.")
    });
  }
  employees.forEach((e, i) => {
    if (!e.name?.trim()) issues.push({
      level: "error",
      msg: t(`직원 ${i + 1}번의 이름이 비어 있습니다.`, `Employee ${i + 1}'s name is empty.`)
    });
    const empLabel = e.name || t(`직원 ${i + 1}`, `Employee ${i + 1}`);
    if (!e.gross || Number(e.gross) <= 0) issues.push({

function doPost(e) {
  try {
    if (!e || !e.postData || !e.postData.contents) {
      return out({ error: 'NO_BODY', note: '요청 본문이 도착하지 않았습니다.' });
    }
    var req = JSON.parse(e.postData.contents);
    var got = String(req.passphrase || '');
    if (got !== PASSPHRASE) {
      // 진단 정보: 암호 자체는 노출하지 않고 길이·문자코드만 알려준다
      return out({
        error: 'UNAUTHORIZED',
        receivedLength: got.length,
        expectedLength: String(PASSPHRASE || '').length,
        receivedCodes: got.split('').map(function (ch) { return ch.charCodeAt(0); }).join(','),
        version: SCRIPT_VERSION
      });
    }
    const sheet = getSheet();
    const wsId = String(req.workspaceId || 'default');
    const row = findRow(sheet, wsId);

    if (req.action === 'load') {
      if (!row) return out({ data: null });
      return out({
        data: JSON.parse(sheet.getRange(row, 2).getValue() || 'null'),
        updatedAt: sheet.getRange(row, 3).getValue()
      });
    }

    if (req.action === 'save') {
      var payload = JSON.stringify(req.data);
      var now = new Date().toISOString();
      if (row) {
        sheet.getRange(row, 2).setValue(payload);
        sheet.getRange(row, 3).setValue(now);
      } else {
        sheet.appendRow([wsId, payload, now]);
      }
      // 사람이 읽을 수 있는 월별요약 시트를 함께 갱신 (실패해도 저장은 유지)
      try {
        rebuildSummary(SpreadsheetApp.getActiveSpreadsheet(), req.data);
      } catch (e2) {
        // 요약 생성 실패는 무시 — 원본 데이터 저장이 우선
      }
      return out({ ok: true, updatedAt: now });
    }

    return out({ error: 'UNKNOWN_ACTION' });
  } catch (err) {
    return out({ error: String(err) });
  }
}

function getSheet() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sheet = ss.getSheetByName(SHEET_NAME);
  if (!sheet) {
    sheet = ss.insertSheet(SHEET_NAME);
    sheet.appendRow(['workspace_id', 'data', 'updated_at']);
  }
  return sheet;
}

function findRow(sheet, wsId) {
  const ids = sheet.getRange(1, 1, Math.max(sheet.getLastRow(), 1), 1).getValues();
  for (let i = 1; i < ids.length; i++) {
    if (String(ids[i][0]) === wsId) return i + 1;
  }
  return null;
}

function out(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}

var VAT_RATE = 0.1;
var PLT_RATE = 0.05;
var DEFAULT_RATE = 4100;
var NSSF_MIN = 400000, NSSF_MAX = 1200000;
var BRACKETS = [

  { lo: 1500000, hi: 2000000, rate: 0.05 },
  { lo: 2000000, hi: 8500000, rate: 0.1 },
  { lo: 8500000, hi: 12500000, rate: 0.15 },

function salaryTax(gross) {

function grossFromNet(net) {
  var n = Number(net) || 0;

  for (var i = 0; i < BRACKETS.length; i++) {
