// 웹(GitHub 페이지): 같은 주소의 최신 파일을 받아 APP_RELEASE 값이 바뀌었는지 본다
async function fetchLatestWebRelease() {
  if (!/^https?:$/.test(location.protocol) || currentApkBuild() != null) return null;
  const res = await fetch(location.pathname + "?v=" + Date.now(), {
    cache: "no-store"
  });
  if (!res.ok) return null;
  const text = await res.text();
  const m = text.match(/APP_RELEASE\s*=\s*"([^"]+)"/);
  return m ? m[1] : null;
}

// GitHub Releases의 최신 APK 정보 — 1시간 안에 확인했다면 저장해 둔 결과를 쓴다 (force면 바로 확인)
async function fetchLatestRelease(force = false) {
  if (!force) {
    try {
      const cached = JSON.parse(localStorage.getItem(UPDATE_CHECK_KEY) || "null");
      if (cached && Date.now() - cached.at < 3600 * 1000) return cached;
    } catch (e) {/* 저장된 값 없음 */}
  }
  const res = await fetch(RELEASES_API, {
    headers: {
      Accept: "application/vnd.github+json"
    }
  });
  if (!res.ok) throw new Error(`GitHub ${res.status}`);
  const json = await res.json();
  const m = String(json.tag_name || "").match(/(\d+)\s*$/);
  const apk = (json.assets || []).find(a => /\.apk$/i.test(a.name || ""));
  const info = {
    at: Date.now(),
    build: m ? parseInt(m[1], 10) : null,
    name: json.name || json.tag_name || "",
    url: apk ? apk.browser_download_url : RELEASES_PAGE,
    publishedAt: json.published_at || null
  };
  try {
    localStorage.setItem(UPDATE_CHECK_KEY, JSON.stringify(info));
  } catch (e) {/* 무시 */}
  return info;
}

function resolveBackendConfig(override) {
  const mode = override?.mode || (override?.gasUrl ? "gsheet" : GAS_WEB_APP_URL ? "gsheet" : "supabase");
  const workspaceId = (override?.workspaceId || WORKSPACE_ID || "default").trim();
  if (mode === "gsheet") {
    const gasUrl = (override?.gasUrl || GAS_WEB_APP_URL || "").trim();
    const passphrase = (override?.passphrase ?? GAS_PASSPHRASE ?? "").trim();
    return {
      mode: "gsheet",
      gasUrl,
      passphrase,
      workspaceId,
      enabled: Boolean(gasUrl),
      url: "",
      anonKey: ""
    };
  }
  const url = (override?.url || SUPABASE_URL || "").trim().replace(/\/+$/, "");
  const anonKey = (override?.anonKey || SUPABASE_ANON_KEY || "").trim();
  return {
    mode: "supabase",
    url,
    anonKey,
    workspaceId,
    enabled: Boolean(url && anonKey),
    gasUrl: "",
    passphrase: ""
  };
}

// 연도 선택지 — 2015년 ~ 내년, 저장된 값이 범위 밖이면 그 값도 포함
function yearOptions(current) {
  const next = new Date().getFullYear() + 1;
  const list = [];
  for (let y = next; y >= 2015; y--) list.push(y);
  if (current && !list.includes(current)) list.unshift(current);
  return list;
}

// 신고월 기준 마감일 — 국세청: 서면 신고 다음 달 20일, e-Filing 다음 달 25일 (MEF Instruction 003, 2020.2.27) / NSSF 다음 달 15일
// 주말·공휴일이면 다음 영업일. 앱의 D-day는 더 이른 서면 마감(20일) 기준으로 센다.
function dueDatesFor(year, month) {
  const dueYear = month === 12 ? year + 1 : year;
  const dueMonth = month === 12 ? 1 : month + 1;
  const gdt = new Date(dueYear, dueMonth - 1, 20);
  const gdtE = new Date(dueYear, dueMonth - 1, 25);
  const nssf = new Date(dueYear, dueMonth - 1, 15);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return {
    gdt,
    gdtE,
    nssf,
    dueMonth,
    days: Math.round((gdt - today) / 86400000),
    daysE: Math.round((gdtE - today) / 86400000)
  };
}

    addedCg = 0;
  for (const lc of local.clients || []) {
    let target = out.clients.find(c => c.id === lc.id) || out.clients.find(c => norm(c.name) && norm(c.name) === norm(lc.name));
    if (!target) {
      out.clients.push(lc);
      target = lc;
      addedClients++;
    }
    const tid = target.id;
    const lf = (local.filings || {})[lc.id] || {};
    const sf = {
      ...(out.filings[tid] || {})
    };
    for (const mk of Object.keys(lf)) if (!sf[mk]) {
      sf[mk] = lf[mk];
      addedMonths++;
    }
    if (Object.keys(sf).length) out.filings[tid] = sf;
    const lcg = (local.capitalGains || {})[lc.id] || [];
    const scg = [...(out.capitalGains[tid] || [])];
    for (const g of lcg) if (!scg.some(x => x.id === g.id)) {
      scg.push(g);
      addedCg++;
    }
    if (scg.length) out.capitalGains[tid] = scg;
  }
  return {
    merged: out,
    addedClients,
    addedMonths,
    addedCg,
    total: addedClients + addedMonths + addedCg
  };
}

// 아티팩트 미리보기 등 iframe 안에서 실행 중인지 감지 — 이 경우 외부 통신이 차단된다
function isEmbedded() {
  try {
    return window.self !== window.top;
  } catch (e) {
    return true; // 접근 자체가 차단되면 iframe 안이라는 뜻
  }
}

/* ---------- Google 스프레드시트 백엔드 (Apps Script 웹앱) ----------
   Content-Type을 text/plain으로 보내 CORS 사전요청(preflight)을 피한다.
   Apps Script 웹앱은 단순 POST 요청에는 CORS 허용 헤더를 붙여 응답한다. */

async function gasRequest(cfg, action, data, extra) {
  const url = (cfg.gasUrl || "").trim();
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url)) {
    throw new Error("웹 앱 URL 형식이 올바르지 않습니다. https://script.google.com/macros/s/.../exec 형태여야 하며 /exec 로 끝나야 합니다 (/dev 주소는 사용할 수 없습니다).");
  }
  let res;
  try {
    res = await fetch(url, {
      method: "POST",
      // text/plain 으로 보내 CORS 사전요청(preflight)을 피한다
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      redirect: "follow",
      body: JSON.stringify({
        action,
        workspaceId: cfg.workspaceId,
        passphrase: cfg.passphrase || "",
        actor: (() => {
          try {
            return localStorage.getItem("ctt:actor") || "";
          } catch (e) {
            return "";
          }
        })(),
        data,
        ...(extra || {})
      })
    });
  } catch (e) {
    if (isEmbedded()) {
      throw new Error("미리보기 창에서는 외부 연결이 차단됩니다. 이 파일을 컴퓨터에 내려받은 뒤 파일을 직접 열어주세요 (주소창이 file:/// 로 시작해야 합니다).");
    }
    throw new Error("연결할 수 없습니다 (Failed to fetch). ① 배포 시 '액세스 권한'이 '모든 사용자'인지, ② 코드 수정 후 '새 배포'로 다시 배포했는지, ③ URL이 잘리지 않았는지 확인하세요. 브라우저에서 이 URL을 직접 열었을 때 화면이 나오면 배포는 정상입니다.");
  }
  if (!res.ok) throw new Error(`요청 실패 (${res.status}) — 배포 설정을 확인하세요.`);
  const text = await res.text();
  let json;
  try {
    json = JSON.parse(text);
  } catch (e) {
    if (text.includes("<!DOCTYPE") || text.includes("<html")) {
      throw new Error("스크립트 대신 로그인/오류 페이지가 반환되었습니다. 배포의 '액세스 권한'을 '모든 사용자'로 바꾼 뒤 새 배포를 만들어 주세요.");
    }
    throw new Error("응답을 읽을 수 없습니다 — 스크립트 코드가 올바르게 붙여넣어졌는지 확인하세요.");
  }
  if (json.error === "NO_BODY") {
    throw new Error("요청 본문이 서버에 도착하지 않았습니다. 브라우저를 바꿔서 시도해 보세요 (Chrome 권장).");
  }
  if (json.error === "UNAUTHORIZED") {
    const sent = (cfg.passphrase || "").length;
    // 서버가 최신 코드라면 진단 정보를 함께 보내준다
    if (typeof json.receivedLength === "number") {
      if (json.receivedLength === 0) {
        throw new Error("서버에 암호가 전달되지 않았습니다(0자). 브라우저를 바꿔서 시도해 보세요 (Chrome 권장).");
      }
      if (json.receivedLength !== sent) {
        throw new Error(`전송 중 암호가 변형되었습니다 — 입력 ${sent}자 → 서버 수신 ${json.receivedLength}자. 브라우저를 바꿔서 시도해 보세요.`);
      }
      if (typeof json.expectedLength === "number" && json.receivedLength !== json.expectedLength) {
        throw new Error(`암호가 다릅니다 — 입력 ${sent}자, 스크립트에 설정된 값은 ${json.expectedLength}자입니다. 스크립트의 PASSPHRASE를 확인하세요.`);
      }
      if (json.receivedCodes) {
        throw new Error(`암호가 일치하지 않습니다 (길이는 같음). 서버가 받은 문자코드: ${json.receivedCodes}. 앞뒤 공백이나 유사문자를 확인하세요.`);
      }
      throw new Error("AUTH_REQUIRED");
    }
    if (json.version && !/^v[4-9]-/.test(json.version)) {
      throw new Error("배포된 스크립트가 최신이 아닙니다. [배포 → 배포 관리 → 편집 → 버전: 새 버전 → 배포]를 실행하세요.");
    }
    throw new Error("AUTH_REQUIRED");
  }
  if (json.error && /50000|50,000|maximum of/i.test(json.error)) {
    throw new Error("서버 코드가 예전 버전이라 사진이 포함된 데이터를 저장하지 못했습니다(셀 용량 초과). 최신 apps-script-code.gs로 교체하고 [배포 관리 → 편집 → 새 버전]으로 배포해 주세요.");
  }
  if (json.error === "FORBIDDEN") throw new Error("이 계정으로는 할 수 없는 작업입니다 (고객사 계정은 자기 회사 신고 자료만 저장할 수 있어요).");
  if (json.error) throw new Error(json.error);
  return json;
}

/* ---------- Supabase Auth (직원별 로그인) ---------- */

async function authRequest(cfg, path, body, token) {
  const res = await fetch(`${cfg.url}/auth/v1/${path}`, {
    method: "POST",
    headers: {
      apikey: cfg.anonKey,
      "Content-Type": "application/json",
      ...(token ? {
        Authorization: `Bearer ${token}`
      } : {})
    },
    body: body ? JSON.stringify(body) : undefined
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(json.error_description || json.msg || json.message || `요청 실패 (${res.status})`);
  }
  return json;
}
async function authSignIn(cfg, email, password) {
  const json = await authRequest(cfg, "token?grant_type=password", {
    email,
    password
  });
  return {
    accessToken: json.access_token,
    refreshToken: json.refresh_token,
    expiresAt: Date.now() + (json.expires_in || 3600) * 1000,
    email: json.user?.email || email,
    userId: json.user?.id || null
  };
}
async function authSignUp(cfg, email, password) {
  const json = await authRequest(cfg, "signup", {
    email,
    password
  });
  // 이메일 확인이 켜져 있으면 access_token 없이 사용자만 생성됨
  if (!json.access_token) return {
    needsConfirmation: true,
    email
  };
  return {
    accessToken: json.access_token,
    refreshToken: json.refresh_token,
    expiresAt: Date.now() + (json.expires_in || 3600) * 1000,
    email: json.user?.email || email,
    userId: json.user?.id || null
  };
}
async function authRefresh(cfg, refreshToken) {
  const json = await authRequest(cfg, "token?grant_type=refresh_token", {
    refresh_token: refreshToken
  });
  return {
    accessToken: json.access_token,
    refreshToken: json.refresh_token,
    expiresAt: Date.now() + (json.expires_in || 3600) * 1000,
    email: json.user?.email || null,
    userId: json.user?.id || null
  };
}
async function authSignOut(cfg, token) {
  try {
    await authRequest(cfg, "logout", null, token);
  } catch (e) {
    // 서버 세션 만료 등 — 로컬 세션만 지워도 로그아웃 처리됨
  }
}

// 만료가 임박한(60초 이내) 토큰은 자동 갱신
async function ensureFreshSession(cfg, session) {
  if (!session) return null;
  if (session.expiresAt - Date.now() > 60000) return session;
  if (!session.refreshToken) return null;
  const next = await authRefresh(cfg, session.refreshToken);
  return {
    ...session,
    ...next,
    email: next.email || session.email
  };
}

  };

async function supabaseLoad(cfg, accessToken) {

    headers: restHeaders(cfg, accessToken)
  });
  if (res.status === 401 || res.status === 403) throw new Error("AUTH_REQUIRED");
  if (!res.ok) throw new Error(`불러오기 실패 (${res.status})`);
  const rows = await res.json();
  if (!rows.length) return null;
  return {
    data: rows[0].data,

  };

async function supabaseSave(cfg, data, accessToken) {

    method: "POST",
    headers: {
      ...restHeaders(cfg, accessToken),
      "Content-Type": "application/json",
      Prefer: "resolution=merge-duplicates,return=representation"
    },
    body: JSON.stringify({
      workspace_id: cfg.workspaceId,
      data,
      updated_at: new Date().toISOString()
    })
  });
  if (res.status === 401 || res.status === 403) throw new Error("AUTH_REQUIRED");
  if (!res.ok) {
    const body = await res.text();
    throw new Error(`저장 실패 (${res.status}) ${body.slice(0, 120)}`);
  }
  return true;
}

// 원천세 세전(총지급액)/세후(실지급액) 입력 모드에 따라 세전 금액을 역산 — 단일세율이므로 나눗셈으로 간단히 역산 가능
function withholdingAmountsFromEntry({
  amountUSD,
  mode,
  category,
  rate
}) {
  const catRate = withholdingRate(category);
  const enteredKHR = (Number(amountUSD) || 0) * rate;
  const grossKHR = mode === "net" ? enteredKHR / (1 - catRate) : enteredKHR;
  const taxKHR = grossKHR * catRate;
  const netKHR = grossKHR - taxKHR;
  return {
    grossKHR,
    taxKHR,
    netKHR,
    catRate
  };
}
function withholdingTotals(list) {

  };
}

// NSSF(사회보장기금) — 직원 8인 이상 사업장 의무가입, 매월 급여와 함께 신고·납부 (익월 15일까지)
// 기여기준임금(Contributory Wage): 실제 총급여를 40만~120만 KHR 사이로 상하한 적용 (Sub-Decree No.144, Prakas No.449)
const NSSF_WAGE_MIN = 400000;
const NSSF_WAGE_MAX = 1200000;
const NSSF_RATES = {
  occupationalRiskEmployer: 0.008,
  // 직업재해 (고용주 전액 부담)
  healthcareEmployer: 0.013,
  // 건강보험 (고용주 분)
  healthcareEmployee: 0.013,
  // 건강보험 (근로자 분, 급여에서 원천공제)
  pensionEmployer: 0.02,
  // 연금 (고용주 분)
  pensionEmployee: 0.02 // 연금 (근로자 분, 급여에서 원천공제)
};
function nssfContributoryWageKHR(grossKHR) {
  const g = Number(grossKHR) || 0;
  if (g <= 0) return 0;
  return Math.min(Math.max(g, NSSF_WAGE_MIN), NSSF_WAGE_MAX);
}
function calcEmployeeNssf(e, rate) {
  const grossKHR = employeeGrossKHR(e, rate);
  const wage = nssfContributoryWageKHR(grossKHR);
  const employerOR = wage * NSSF_RATES.occupationalRiskEmployer;
  const employerHealthcare = wage * NSSF_RATES.healthcareEmployer;
  const employeeHealthcare = wage * NSSF_RATES.healthcareEmployee;
  const employerPension = wage * NSSF_RATES.pensionEmployer;
  const employeePension = wage * NSSF_RATES.pensionEmployee;
  const employerTotal = employerOR + employerHealthcare + employerPension;
  const employeeTotal = employeeHealthcare + employeePension;
  return {
    wage,
    employerOR,
    employerHealthcare,
    employeeHealthcare,
    employerPension,
    employeePension,
    employerTotal,
    employeeTotal,
    grandTotal: employerTotal + employeeTotal
  };
}
function calcNssfTotals(employees, rate) {

// method: "actual" (실제 취득원가+부대비용 차감) | "deemed" (취득원가 미확인 시 이전가액의 80%를 취득원가로 간주 — 부동산에 한해 실무상 사용)
function calcCapitalGain(entry) {
  const transferPrice = Number(entry.transferPrice) || 0;
  const acquisitionCost = Number(entry.acquisitionCost) || 0;
  const expenses = Number(entry.expenses) || 0;
  const costBasis = entry.method === "deemed" ? transferPrice * 0.8 : acquisitionCost + expenses;
  const gain = Math.max(transferPrice - costBasis, 0);
  const tax = gain * CGT_RATE;

    transferPrice,
    costBasis,
    gain,
    tax
  };

function calcSalaryTax(gross) {
  const g = Number(gross) || 0;
  let tax = 0;
  for (const b of SALARY_BRACKETS) {
    if (g > b.lo) {
      tax += (Math.min(g, b.hi) - b.lo) * b.rate;
    }
  }
  return Math.round(tax);
}

// 개인별 급여세 신고 명세서용 구간별 상세 계산
function calcSalaryBreakdown(grossKHR) {
  const g = Number(grossKHR) || 0;
  const rows = [];
  let totalTax = 0;
  for (const b of SALARY_BRACKETS) {
    const taxable = g > b.lo ? Math.min(g, b.hi) - b.lo : 0;
    const tax = Math.round(taxable * b.rate);
    if (b.rate === 0 || taxable > 0) {
      rows.push({
        lo: b.lo,
        hi: b.hi,
        rate: b.rate,
        taxable,
        tax
      });
    }
    totalTax += tax;
  }
  return {
    rows,
    totalTax: Math.round(totalTax),
    gross: g,
    net: Math.round(g - totalTax)
  };
}

// 세후(net) 금액에서 세전(gross) 금액을 역산 — 구간별로 선형이므로 구간을 찾아 역함수 적용
function grossFromNet(netKHR) {
  const net = Number(netKHR) || 0;
  if (net <= 0) return 0;
  for (const b of SALARY_BRACKETS) {
    const netAtHi = b.hi === Infinity ? Infinity : b.hi - calcSalaryTax(b.hi);
    if (net <= netAtHi) {
      const taxAtLo = calcSalaryTax(b.lo);
      return (net - b.rate * b.lo + taxAtLo) / (1 - b.rate);
    }
  }
  return net;
}

// ── 직원별 급여세 (Sub-Decree 196, 2023년 1월 시행) ──
// · 거주자: 부양가족(일하지 않는 배우자, 14세 미만 또는 25세 미만 전일제 학생 자녀) 1인당 월 150,000 KHR를 과세표준에서 공제한 뒤 누진세율
// · 비거주자: 캄보디아 원천 급여에 20% 단일세율(분리과세)
// · 현물급여(Fringe benefits): 지급액의 20%를 고용주가 납부
const DEPENDENT_ALLOWANCE_KHR = 150000;
const NONRESIDENT_SALARY_RATE = 0.2;
const FRINGE_BENEFIT_RATE = 0.2;
function employeeTaxableBase(e, grossKHR) {
  if (e?.nonResident) return Math.max(0, Number(grossKHR) || 0);
  return Math.max(0, (Number(grossKHR) || 0) - (Number(e?.dependents) || 0) * DEPENDENT_ALLOWANCE_KHR);
}
function employeeSalaryTax(e, grossKHR) {
  if (e?.nonResident) return Math.round((Number(grossKHR) || 0) * NONRESIDENT_SALARY_RATE);
  return calcSalaryTax(employeeTaxableBase(e, grossKHR));
}
function employeeFringeTax(e, rate) {
  return Math.round((Number(e?.fringe) || 0) * rate * FRINGE_BENEFIT_RATE);
}
// 세후 금액 → 세전 금액 (부양가족·비거주자까지 반영) — 세후액은 세전액이 늘수록 늘어나므로 이분 탐색
function grossFromNetFor(e, netKHR) {
  const net = Number(netKHR) || 0;
  if (net <= 0) return 0;
  let lo = net,
    hi = net / (1 - 0.2) + 1;
  for (let i = 0; i < 80; i++) {
    const mid = (lo + hi) / 2;
    if (mid - employeeSalaryTax(e, mid) < net) lo = mid;else hi = mid;
  }
  return Math.round(hi);
}

// 직원 입력값(세전 또는 세후, USD)과 환율로부터 세전 총급여(KHR)를 계산
function employeeGrossKHR(e, rate) {
  const enteredKHR = (Number(e.gross) || 0) * rate;
  return e.mode === "net" ? grossFromNetFor(e, enteredKHR) : enteredKHR;
}

// 경비 계정과목 → 원천세 대상 여부 매핑
// 해당 계정과목으로 지출하면 통상 원천세 납부의무가 발생하므로 기본값으로 제안한다
const EXPENSE_TO_WHT = {

    totalVatKHR

const DEFAULT_EXCHANGE_RATE = 4100;
const VAT_RATE = 0.1;
function getRate(f) {

// 공급가액(USD) 입력 시 VAT 10%를 자동 계산해 총금액까지 함께 보여주기 위한 헬퍼
function vatBreakdown(supplyUSD, rate) {

  const vat = supply * VAT_RATE;
  const total = supply + vat;
  return {
    supplyUSD: supply,
    vatUSD: vat,
    totalUSD: total,
    supplyKHR: supply * rate,
    vatKHR: vat * rate,
    totalKHR: total * rate
  };
}
function calcMonthly(f) {
  const rate = getRate(f);
  const revenue = vatBreakdown(f?.revenue, rate);
  const purchase = vatBreakdown(f?.purchase, rate);
  const employees = f?.employees || [];
  const {
    totalExpenseKHR,
    totalVatKHR
  } = evidenceTotals(f?.evidence);
  const {
    totalTaxKHR: withholdingTaxTotal,
    totalBaseKHR: withholdingBaseTotal
  } = withholdingTotals(f?.withholding);
  const expensesManualKHR = (Number(f?.expenses) || 0) * rate;
  const inputVAT = purchase.vatKHR + totalVatKHR;
  const totalExpenses = expensesManualKHR + purchase.supplyKHR + totalExpenseKHR;
  const outputVAT = revenue.vatKHR;
  const vatPayable = Math.max(outputVAT - inputVAT, 0);
  const ppt = revenue.supplyKHR * 0.01;
  const pltBaseKHR = (Number(f?.alcoholTobaccoRevenue) || 0) * rate;

  const fringeTaxTotal = employees.reduce((s, e) => s + employeeFringeTax(e, rate), 0);
  // NSSF는 가입 대상 사업장(직원 8인 이상 등)으로 지정된 경우에만 계산한다
  const nssfApplicable = f?.nssfApplicable === true;
  const nssf = nssfApplicable ? calcNssfTotals(employees, rate) : {
    employerTotal: 0,
    employeeTotal: 0,
    grandTotal: 0
  };
  const totalDue = vatPayable + ppt + plt + salaryTaxTotal + fringeTaxTotal + withholdingTaxTotal;
  return {
    rate,
    revenue,
    purchase,
    revenueKHR: revenue.supplyKHR,
    outputVAT,
    vatPayable,
    ppt,
    pltBaseKHR,
    plt,
    salaryTaxTotal,
    fringeTaxTotal,
    withholdingTaxTotal,
    withholdingBaseTotal,
    nssfApplicable,
    nssfEmployerTotal: nssf.employerTotal,
    nssfEmployeeTotal: nssf.employeeTotal,
    nssfGrandTotal: nssf.grandTotal,
    totalDue,
    inputVAT,
    totalExpenses,
    evidenceVat: totalVatKHR,
    evidenceExpense: totalExpenseKHR
  };
}
function calcAnnual(filingsForClient, year) {
  let revenue = 0,
    expenses = 0,
    pptPaid = 0,
    withholdingPaid = 0,
    nssfPaid = 0,
    monthsFiled = 0;
  for (let m = 1; m <= 12; m++) {
    const key = `${year}-${String(m).padStart(2, "0")}`;
    const f = filingsForClient?.[key];
    if (f) {
      const monthly = calcMonthly(f);
      revenue += monthly.revenueKHR;
      expenses += monthly.totalExpenses;
      pptPaid += monthly.ppt;
      withholdingPaid += monthly.withholdingTaxTotal;
      nssfPaid += monthly.nssfGrandTotal;
      monthsFiled++;
    }
  }
  const profit = revenue - expenses;
  const incomeTax = profit > 0 ? profit * 0.2 : 0;
  const minTax = revenue * 0.01;
  const annualToiDue = Math.max(incomeTax, minTax);
  const balance = annualToiDue - pptPaid;
  return {
    revenue,
    expenses,
    profit,
    incomeTax,
    minTax,
    annualToiDue,
    pptPaid,
    withholdingPaid,
    nssfPaid,
    balance,
    monthsFiled
  };
}

// 월별 손익계산서: 매출액 - 매입원가 = 매출총이익, - 급여(고용주 NSSF 부담분 포함)·기타경비 = 영업이익
function calcIncomeStatement(f) {
  const m = calcMonthly(f);
  const rate = m.rate;
  const employees = f?.employees || [];
  const grossPayroll = employees.reduce((s, e) => s + employeeGrossKHR(e, rate), 0);
  const payroll = grossPayroll + m.nssfEmployerTotal; // 총급여 + 고용주 NSSF 부담분(직업재해+건강보험+연금) = 실제 인건비 총액
  const expensesManualKHR = (Number(f?.expenses) || 0) * rate;
  const revenue = m.revenue.supplyKHR;
  const cogs = m.purchase.supplyKHR;
  const grossProfit = revenue - cogs;
  const opex = expensesManualKHR + m.evidenceExpense;
  const operatingProfit = grossProfit - payroll - opex;
  return {
    rate,
    revenue,
    cogs,
    grossProfit,
    payroll,
    opex,
    operatingProfit,
    ppt: m.ppt
  };
}

// 연간 손익계산서: 월별 입력분을 급여를 포함한 발생주의 방식으로 합산, 세금은 연간 ToI 확정세액을 반영
function calcAnnualIncomeStatement(filingsForClient, year) {
  let revenue = 0,
    cogs = 0,
    payroll = 0,
    opex = 0,
    monthsFiled = 0,
    lastRate = DEFAULT_EXCHANGE_RATE;
  const monthly = [];
  for (let mo = 1; mo <= 12; mo++) {
    const key = monthKey(year, mo);
    const f = filingsForClient?.[key];
    if (f) {
      const is = calcIncomeStatement(f);
      revenue += is.revenue;
      cogs += is.cogs;
      payroll += is.payroll;
      opex += is.opex;
      monthsFiled++;
      lastRate = is.rate;
      monthly.push({
        month: mo,
        ...is
      });
    }
  }
  const grossProfit = revenue - cogs;
  const operatingProfit = grossProfit - payroll - opex;
  const annualTax = calcAnnual(filingsForClient, year);
  const netIncome = operatingProfit - annualTax.annualToiDue;
  return {
    revenue,
    cogs,
    grossProfit,
    payroll,
    opex,
    operatingProfit,
    monthsFiled,
    monthly,
    rate: lastRate,
    annualToiDue: annualTax.annualToiDue,
    pptPaid: annualTax.pptPaid,
    netIncome
  };
}

  t = t.replace(/^https?:\/\//i, "").replace(/^(www\.)?(t|telegram)\.me\//i, "").replace(/^@/, "").replace(/[/?#].*$/, "");
  if (/^\+?[\d\s-]{7,}$/.test(t)) return "+" + t.replace(/\D/g, "");
  return t;
}
function isValidTelegram(v) {
  const t = normalizeTelegram(v);
  return !t || /^[A-Za-z][A-Za-z0-9_]{3,31}$/.test(t) || /^\+\d{8,15}$/.test(t);
}
function isValidEmail(v) {
  const e = String(v || "").trim();
  return !e || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
}
// 상대 채팅창을 열고 메시지를 미리 채운다 (보내기는 텔레그램에서 한 번 더 누름)
function telegramLabel(v) {
  const t = normalizeTelegram(v);
  return t ? t.startsWith("+") ? t : "@" + t : "";
}
function telegramLink(handle, text) {
  const t = normalizeTelegram(handle);
  if (!t) return "";
  return `https://t.me/${t}${text ? `?text=${encodeURIComponent(text)}` : ""}`;
}
function mailLink(email, subject, body) {
  const e = String(email || "").trim();
  if (!e) return "";
  return `mailto:${e}?subject=${encodeURIComponent(subject || "")}&body=${encodeURIComponent(body || "")}`;
}
function uid() {
  return Math.random().toString(36).slice(2, 10);
}

// 업로드한 증빙 이미지를 저장소 용량 절약을 위해 축소 후 base64로 변환 (저장용 썸네일)
function fileToResizedDataUrl(file, maxWidth = 600, quality = 0.6) {
  return fileToScaledDataUrl(file, {
    scaleFor: w => Math.min(1, maxWidth / w),
    quality
  });
}

// AI 인식용 고해상도 이미지 — 긴 변 1568px(Claude 비전이 그대로 읽는 최대 크기), 품질 0.88.
// 저장용 썸네일(480px)로 인식하면 영수증의 작은 숫자가 뭉개져 오인식이 잦다.
function fileToRecognitionDataUrl(file) {
  return fileToScaledDataUrl(file, {
    scaleFor: (w, h) => Math.min(1, 1568 / Math.max(w, h)),
    quality: 0.88
  });
}
function isHeic(file) {
  return /heic|heif/i.test(file?.type || "") || /\.(heic|heif)$/i.test(file?.name || "");
}
function fileToScaledDataUrl(file, {
  scaleFor,
  quality
}) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("파일을 읽지 못했습니다"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error(isHeic(file) ? "HEIC_UNSUPPORTED" : "이미지를 불러오지 못했습니다"));
      img.onload = () => {
        const scale = scaleFor(img.width, img.height);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff"; // 투명 PNG가 검은 배경으로 바뀌어 글자가 안 보이는 것을 방지
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- AI 분류 호출 경로 ----------
   Claude 아티팩트 안에서는 API 키가 자동 주입되어 api.anthropic.com을 직접 호출할 수 있지만,
   GitHub Pages 등 외부에서 실행할 때는 키가 없으므로 Apps Script 백엔드가 대신 호출한다.
   (API 키는 스크립트 속성에만 저장되어 이 파일에는 포함되지 않는다) */

let __aiBackend = null; // 백엔드 설정을 앱에서 주입받는다
function setAiBackend(cfg) {
  __aiBackend = cfg && cfg.mode === "gsheet" && cfg.gasUrl ? cfg : null;
}

// 비전(이미지 판독) 성능이 더 좋은 최신 모델을 먼저 쓰고, 사용할 수 없으면 기존 모델로 자동 전환
const AI_MODELS = ["claude-sonnet-5-5", "claude-sonnet-4-6"];
async function callClaude(messages) {
  // 1순위: 백엔드 프록시 (외부 실행 환경) — 예전 버전 스크립트는 model 값을 무시하고 자체 모델을 쓴다
  if (__aiBackend) {
    let json;
    try {
      json = await gasRequest(__aiBackend, "classify", {
        messages,
        model: AI_MODELS[0]
      });
    } catch (e) {
      throw new Error(e.message === "AUTH_REQUIRED" ? "AI_AUTH" : e.message);
    }
    if (json.aiError) {
      if (/API 키|ANTHROPIC_API_KEY/.test(json.aiError)) throw new Error("AI_NO_KEY");
      throw new Error(json.aiError);
    }
    return json.result;
  }
  // 2순위: 아티팩트 환경에서의 직접 호출
  let lastErr = null;
  for (const model of AI_MODELS) {
    let response;
    try {
      response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model,
          max_tokens: 1000,
          messages
        })
      });
    } catch (e) {
      throw new Error("AI_NETWORK");
    }
    let data = null;
    try {
      data = await response.json();
    } catch (e) {/* 본문 없음 */}
    if (!response.ok || data?.error) {
      const msg = data?.error?.message || `HTTP ${response.status}`;
      lastErr = new Error(msg);
      if (/model/i.test(msg) || response.status === 404) continue; // 모델을 쓸 수 없음 → 다음 모델
      throw lastErr;
    }
    const textBlock = (data?.content || []).find(b => b.type === "text");
    if (!textBlock) throw new Error("분류 응답을 받지 못했습니다");
    return textBlock.text;
  }
  throw lastErr || new Error("분류 응답을 받지 못했습니다");
}

// 응답 앞뒤에 설명이나 코드펜스가 붙어 있어도 첫 번째 JSON 객체만 골라 읽는다
function parseAiJson(text) {
  const cleaned = String(text || "").replace(/```json|```/g, "").trim();
  try {
    return JSON.parse(cleaned);
  } catch (e) {
    const start = cleaned.indexOf("{");
    const end = cleaned.lastIndexOf("}");
    if (start >= 0 && end > start) return JSON.parse(cleaned.slice(start, end + 1));
    throw new Error("AI_BAD_JSON");
  }
}

// AI 인식 오류를 사용자가 이해할 수 있는 안내로 바꾼다
function describeAiError(message, lang) {
  const en = lang === "en";
  const m = String(message || "");
  if (m === "HEIC_UNSUPPORTED") return en ? "This is an iPhone HEIC photo, which this browser can't open. Take a screenshot of the photo, or set the camera to 'Most Compatible' (JPEG), and upload again." : "아이폰 HEIC 사진이라 이 브라우저에서 열 수 없습니다. 사진을 스크린샷으로 찍어 올리거나, 카메라 설정을 '높은 호환성(JPEG)'으로 바꿔 다시 촬영해 주세요.";
  if (m === "AI_NO_KEY") return en ? "The AI key is not set on the server. In Apps Script → Project settings → Script properties, add ANTHROPIC_API_KEY." : "서버에 AI 키가 없습니다. Apps Script → 프로젝트 설정 → 스크립트 속성에 ANTHROPIC_API_KEY를 추가하세요.";
  if (m === "AI_AUTH") return en ? "The server rejected the request (passphrase). Lock and reopen with the correct passphrase." : "서버가 요청을 거부했습니다(암호). 잠금 후 올바른 암호로 다시 열어 주세요.";
  if (m === "AI_NETWORK" || /Failed to fetch|미리보기 창|연결할 수 없습니다/.test(m)) return en ? "Couldn't reach the AI service — the preview window or network blocks it. Open the app (or the GitHub page) and try again." : "AI 서버에 연결하지 못했습니다 — 미리보기 창이거나 네트워크가 막혀 있습니다. 앱(또는 GitHub 페이지)에서 열어 다시 시도해 주세요.";
  if (m === "UNKNOWN_ACTION") return en ? "The Google Apps Script on the server is an old version without photo recognition. Replace it with the latest apps-script-code.gs and deploy a new version (Deploy → Manage deployments → Edit → New version)." : "Google 서버(Apps Script)에 배포된 코드가 예전 버전이라 사진 인식 기능이 없습니다. 최신 apps-script-code.gs로 교체한 뒤 [배포 → 배포 관리 → 편집(연필) → 버전: 새 버전 → 배포]를 해 주세요.";
  if (/UrlFetchApp|권한|permission/i.test(m)) return en ? "The Apps Script isn't authorised to call the AI service yet. In the Apps Script editor, run the function testAiConnection once and allow access." : "Apps Script가 아직 AI 서버에 접속할 권한이 없습니다. Apps Script 편집기에서 testAiConnection 함수를 한 번 실행해 권한을 허용해 주세요.";
  if (m === "AI_BAD_JSON") return en ? "The AI reply couldn't be read. Press Retry." : "AI 응답 형식을 읽지 못했습니다. [다시 인식]을 눌러 주세요.";
  if (/overloaded|529|rate|429/i.test(m)) return en ? "The AI service is busy. Wait a few seconds and press Retry." : "AI 서비스가 혼잡합니다. 잠시 후 [다시 인식]을 눌러 주세요.";
  return m;
}

// 크메르 숫자(០-៩)를 아라비아 숫자로
function khmerDigitsToAscii(v) {
  return String(v ?? "").replace(/[\u17E0-\u17E9]/g, ch => String(ch.charCodeAt(0) - 0x17e0));
}

// "12,500" · "12,500.00" · "៛51 250" · "$ 12.50" · "12,50" 등 영수증 금액 표기를 숫자로
function parseReceiptAmount(v) {
  if (typeof v === "number") return Number.isFinite(v) ? v : null;
  let t = khmerDigitsToAscii(v).replace(/[^\d.,\s]/g, "").trim();
  if (!t) return null;
  t = t.replace(/\s+/g, "");
  if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(t)) t = t.replace(/,/g, ""); // 1,234,567.89
  else if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t = t.replace(/\./g, "").replace(",", "."); // 1.234.567,89
  else if (/^\d+,\d{1,2}$/.test(t)) t = t.replace(",", "."); // 12,50
  else t = t.replace(/,/g, "");
  const n = Number(t);
  return Number.isFinite(n) && n > 0 ? n : null;
}

// 날짜 문자열을 YYYY-MM-DD로 — 캄보디아 영수증은 일/월/연 순서가 기본
function parseReceiptDate(v) {
  const t = khmerDigitsToAscii(v).trim();
  if (!t || t === "null") return null;
  let y, m, d;
  let mt;
  if (mt = t.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/)) {
    y = +mt[1];
    m = +mt[2];
    d = +mt[3];
  } else if (mt = t.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/)) {
    d = +mt[1];
    m = +mt[2];
    y = +mt[3];
    if (y < 100) y += 2000;
    if (m > 12 && d <= 12) {
      const x = d;
      d = m;
      m = x;
    } // 월/일 순서로 적힌 경우
  } else return null;
  const dt = new Date(Date.UTC(y, m - 1, d));
  if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return null; // 2/30 같은 없는 날짜
  return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}

// 증빙 이미지에서 거래일자와 금액만 읽어온다 (계정과목·거래처는 사용자가 직접 선택)
// 읽을 수 없는 항목은 null, 의심스러운 항목은 flags에 이유를 담아 화면에서 "확인 필요"로 표시한다
const RECEIPT_PROMPT = `You are reading ONE expense receipt, tax invoice, or bill photographed in Cambodia.
Extract ONLY the transaction date and the final total. Read carefully digit by digit; do not guess.

Cambodian receipt conventions:
- Dates are usually DAY/MONTH/YEAR (e.g. 05/11/2026 = 5 November 2026). Some POS slips print YYYY-MM-DD or "05-Nov-26".
- Many receipts show the total in BOTH USD ($) and Khmer riel (KHR, ៛, "Riel", "R"), often with an exchange rate line (about 4,000–4,200 KHR per USD).
- Total labels: "Grand Total", "Total", "Total Amount", "Amount Due", "Net Amount", "សរុប", "សរុបរួម", "ប្រាក់ត្រូវបង់". Tax invoices show "VAT 10%" and a total including VAT.
- For the total, IGNORE: subtotal before VAT, item prices, quantities, "Cash", "Cash received/Tendered", "Change", "Balance returned", discounts lines, phone numbers, invoice numbers, TIN/VATTIN numbers, table numbers, times.
- Separately, read the SELLER's (supplier's) VAT TIN if printed — labels "VATTIN", "VAT TIN", "TIN", "លេខអត្តសញ្ញាណកម្មសារពើពន្ធ". Format is usually one letter + 3 digits + 9 digits, e.g. K001-901234567. Do NOT return the buyer's/customer's TIN.
- Digits may be Khmer numerals (០១២៣៤៥៦៧៨៩) — convert to 0-9.
- Riel amounts have no decimals and use thousands separators (e.g. 51,200). USD amounts usually have 2 decimals (e.g. 12.50).

Return ONLY raw JSON, no markdown, no extra text, with exactly these keys:
{
  "date": "YYYY-MM-DD or null if not visible/unreadable (never invent a year)",
  "date_text": "the date exactly as printed, or null",
  "total": number or null  // the final amount payable INCLUDING tax, in the receipt's primary currency
  "currency": "USD" or "KHR" or null,
  "total_text": "the total line exactly as printed, e.g. 'Grand Total: $12.50', or null",
  "other_total": number or null  // the same total shown in the OTHER currency, if printed
  "other_currency": "USD" or "KHR" or null,
  "supplier_vattin": "seller's VATTIN exactly as printed, or null",
  "confidence": "high" | "medium" | "low"
}
If the image is not a receipt/invoice or is too blurry, return nulls with "confidence": "low".`;
async function readReceiptBasics({
  dataUrl,
  exchangeRate
}) {
  const base64 = dataUrl.split(",")[1];
  const mediaType = dataUrl.substring(5, dataUrl.indexOf(";"));
  const ask = () => callClaude([{
    role: "user",
    content: [{
      type: "image",
      source: {
        type: "base64",
        media_type: mediaType,
        data: base64
      }
    }, {
      type: "text",
      text: RECEIPT_PROMPT
    }]
  }]);
  let parsed;
  try {
    parsed = parseAiJson(await ask());
  } catch (e) {
    if (e.message !== "AI_BAD_JSON" && !(e instanceof SyntaxError)) throw e;
    parsed = parseAiJson(await ask()); // 형식이 깨진 응답은 한 번 더 요청
  }
  return checkReceiptReading(parsed, exchangeRate);
}

// AI가 읽은 값을 검증해 확정값과 "확인 필요" 사유를 만든다 (네트워크 없이 단독 테스트 가능)
function checkReceiptReading(parsed, exchangeRate, today = new Date()) {
  const flags = {
    date: null,
    amount: null
  };
  const rate = Number(exchangeRate) || DEFAULT_EXCHANGE_RATE;

  // 날짜: 모델이 YYYY-MM-DD로 못 맞춘 경우 원문(date_text)에서 다시 해석
  let date = parseReceiptDate(parsed?.date) || parseReceiptDate(parsed?.date_text);
  if (date) {
    const dt = new Date(date + "T00:00:00");
    const days = (dt - new Date(today.getFullYear(), today.getMonth(), today.getDate())) / 86400000;
    if (days > 1) flags.date = "future";else if (days < -400) flags.date = "old";
  }
  let currency = parsed?.currency === "USD" || parsed?.currency === "KHR" ? parsed.currency : null;
  let amount = parseReceiptAmount(parsed?.total ?? parsed?.amount);
  const otherCurrency = parsed?.other_currency === "USD" || parsed?.other_currency === "KHR" ? parsed.other_currency : null;
  const otherAmount = parseReceiptAmount(parsed?.other_total);

  // 통화 표시가 숫자 크기와 맞지 않으면 바로잡거나 확인 요청
  if (amount && !currency) currency = amount >= 1000 && Number.isInteger(amount) ? "KHR" : "USD";
  if (amount && currency === "KHR" && amount < 500) flags.amount = "currencyMismatch";
  if (amount && currency === "USD" && amount >= 100000) flags.amount = "currencyMismatch";

  // 두 통화 합계가 함께 있으면 환율로 서로 맞는지 확인
  let alt = null;
  if (amount && otherAmount && otherCurrency && otherCurrency !== currency) {
    alt = {
      amount: otherAmount,
      currency: otherCurrency
    };
    const usd = currency === "USD" ? amount : otherAmount;
    const khr = currency === "KHR" ? amount : otherAmount;
    const implied = khr / usd;
    if (!(implied > rate * 0.85 && implied < rate * 1.15)) flags.amount = flags.amount || "totalsDisagree";
  }
  const confidence = ["high", "medium", "low"].includes(parsed?.confidence) ? parsed.confidence : "medium";
  if (confidence === "low") {
    if (date && !flags.date) flags.date = "lowConfidence";
    if (amount && !flags.amount) flags.amount = "lowConfidence";
  }
  return {
    date: date || null,
    amount: amount || null,
    currency: amount ? currency : null,
    alt,
    dateText: typeof parsed?.date_text === "string" ? parsed.date_text : null,
    amountText: typeof parsed?.total_text === "string" ? parsed.total_text : null,
    vattin: typeof parsed?.supplier_vattin === "string" && parsed.supplier_vattin.trim() ? normalizeKhTin(parsed.supplier_vattin) : null,
    confidence,
    flags
  };
}
function receiptFlagText(reason, lang) {
  const en = lang === "en";
  return {
    future: en ? "date is in the future" : "미래 날짜",
    old: en ? "date is over a year old" : "1년 넘은 날짜",
    lowConfidence: en ? "image is hard to read" : "사진이 흐려 불확실",
    currencyMismatch: en ? "currency looks wrong for this number" : "금액과 통화가 맞지 않아 보임",
    totalsDisagree: en ? "USD and KHR totals don't match the rate" : "USD·KHR 합계가 환율과 맞지 않음"
  }[reason] || reason;
}

// Claude API(Sonnet)로 원천세 지급 증빙(계약서/청구서/영수증)을 분류: 지급유형/지급처/금액/통화 추출
async function classifyWithholding({
  dataUrl,
  description,
  exchangeRate
}) {
  const base64 = dataUrl.split(",")[1];
  const mediaType = dataUrl.substring(5, dataUrl.indexOf(";"));
  const categoryList = WITHHOLDING_CATEGORIES.map(c => `${c.id} (${c.ko} / ${c.en}, ${(c.rate * 100).toFixed(0)}%)`).join(", ");
  const instruction = `You are an accounting assistant classifying withholding-tax source documents (invoices, contracts, receipts for rent/services/interest/royalty payments) for a business in Cambodia. "category" must be exactly one of the id tokens below.
User note: ${description || "(none)"}

Valid category ids: ${categoryList}

Reading tips: read digits carefully one by one. Documents may show amounts in USD ($) and/or Khmer riel (KHR, ៛); report the main payable amount before withholding, in the currency it is printed in. Convert Khmer numerals (០-៩) to 0-9. Ignore invoice numbers, TIN/VATTIN, phone numbers and dates when looking for the amount.

Look at the image and reply with ONLY raw JSON, no markdown fences, no extra text:
{
  "category": "exactly one id token from the list above, based on the nature of the payment (rent, service/consulting fee, interest, royalty, or payment to a non-resident)",
  "payee": "the payee/vendor/landlord name being paid (empty string if unreadable)",
  "amount": number only, no currency symbol — the gross payment amount before withholding,
  "currency": "KHR or USD",
  "summary_ko": "one short summary sentence written in Korean",
  "summary_en": "the same summary sentence written in English (not a translation note — a natural English sentence)"
}`;
  const text = await callClaude([{
    role: "user",
    content: [{
      type: "image",
      source: {
        type: "base64",
        media_type: mediaType,
        data: base64
      }
    }, {
      type: "text",
      text: instruction
    }]
  }]);
  const parsed = parseAiJson(text);
  const rate = Number(exchangeRate) || DEFAULT_EXCHANGE_RATE;

// 내부검증: 신고 전 직원이 놓치기 쉬운 항목을 점검
function validateFiling(filing, client, prevFiling, lang) {
  const t = (ko, en) => lang === "en" ? en : ko;
  const issues = [];
  const revenue = Number(filing?.revenue) || 0;
  const purchase = Number(filing?.purchase) || 0;
  const employees = filing?.employees || [];
  if (!client?.tin) {
    issues.push({
      level: "warning",
      msg: t("고객사 TIN(사업자등록번호)이 등록되어 있지 않습니다.", "Client TIN (tax ID) is not registered.")
    });
  }
  if (revenue === 0 && employees.length === 0 && purchase === 0) {
    issues.push({
      level: "info",
      msg: t("이번 기간 데이터가 아직 입력되지 않았습니다.", "No data has been entered for this period yet.")
    });
  }
  if (revenue > 0 && purchase > revenue) {
    issues.push({
      level: "warning",
      msg: t("매입액이 매출액보다 큽니다 — 환급/이월 대상인지 확인하세요.", "Purchases exceed revenue — check whether this qualifies for VAT refund/carryforward.")
    });
  }
  employees.forEach((e, i) => {
    if (!e.name?.trim()) issues.push({
      level: "error",
      msg: t(`직원 ${i + 1}번의 이름이 비어 있습니다.`, `Employee ${i + 1}'s name is empty.`)
    });
    const empLabel = e.name || t(`직원 ${i + 1}`, `Employee ${i + 1}`);
    if (!e.gross || Number(e.gross) <= 0) issues.push({
      level: "error",
      msg: t(`${empLabel}의 총급여가 입력되지 않았습니다.`, `${empLabel}'s gross salary has not been entered.`)
    });
  });
  const dupNames = employees.map(e => e.name?.trim()).filter((n, i, arr) => n && arr.indexOf(n) !== i);
  if (dupNames.length) issues.push({
    level: "warning",
    msg: t(`중복된 직원명이 있습니다: ${[...new Set(dupNames)].join(", ")}`, `Duplicate employee names found: ${[...new Set(dupNames)].join(", ")}`)
  });
  if (employees.length >= 8 && filing?.nssfApplicable !== true) {
    issues.push({
      level: "warning",
      msg: t("직원이 8명 이상인데 NSSF가 '비대상'으로 설정되어 있습니다 — 의무가입 대상이니 가입 여부를 확인하세요.", "8 or more employees but NSSF is set to 'not registered' — registration is mandatory at this size; please confirm.")
    });
  }
  (filing?.withholding || []).forEach((w, i) => {
    if (!w.payee?.trim()) issues.push({
      level: "error",
      msg: t(`원천세 항목 ${i + 1}번의 지급처가 비어 있습니다.`, `Withholding item ${i + 1}'s payee is empty.`)
    });
    if (!w.amount || Number(w.amount) <= 0) issues.push({
      level: "error",
      msg: t(`원천세 항목 ${i + 1}번의 지급액이 입력되지 않았습니다.`, `Withholding item ${i + 1}'s payment amount has not been entered.`)
    });
  });
  const vatNoTin = (filing?.evidence || []).filter(e => e.isVatInvoice && !isValidKhTin(e.supplierTin));
  if (vatNoTin.length) {
    issues.push({
      level: "warning",
      msg: t(`VAT 인보이스 ${vatNoTin.length}건에 공급자 VATTIN이 없거나 형식이 맞지 않아요 — 매입세액공제가 거부될 수 있어요. (${vatNoTin.slice(0, 3).map(e => e.vendor || e.txDate || "?").join(", ")})`, `${vatNoTin.length} VAT invoice(s) have no valid supplier VATTIN — the input VAT credit may be refused. (${vatNoTin.slice(0, 3).map(e => e.vendor || e.txDate || "?").join(", ")})`)
    });
  }
  if (prevFiling) {
    const prevRevenue = Number(prevFiling.revenue) || 0;
    if (prevRevenue > 0 && revenue > 0) {
      const change = Math.abs(revenue - prevRevenue) / prevRevenue;
      if (change >= 0.5) {
        const pct = Math.round(change * 100);
        issues.push({
          level: "warning",
          msg: t(`전월 대비 매출 변동이 ${pct}%입니다 — 증빙 누락 여부를 확인하세요.`, `Revenue changed ${pct}% from last month — check for missing documentation.`)
        });
      }
    }
  }
  if (filing?.filed && issues.some(i => i.level === "error")) {
    issues.push({
      level: "error",
      msg: t("신고 완료로 표시되어 있으나 아직 해결되지 않은 오류가 있습니다.", "Marked as filed, but there are still unresolved errors.")
    });
  }
  return issues;
}

      } catch (e) {
        if (e.message === "AUTH_REQUIRED") {
          setAuthRequired(true);
        } else if (cfg.enabled) {

        }
      }

      // 4) 언어는 기기별 개인 설정
      try {

      } catch (e) {

    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);
  const changeLang = async next => {
    setLang(next);

      await window.storage.set(LANG_KEY, next, false);

    }
  };

  // optimistic=false 이면 서버 저장이 성공한 뒤에만 화면 데이터를 바꾼다 (월별 신고 저장용 — 실패 시 편집 내용 보존)
  const persist = useCallback(async (next, {
    optimistic = true,
    paths = null
  } = {}) => {
    const prev = dataRef.current;
    if (optimistic) setData(next);
    const cfg = backendRef.current;
    try {
      if (!cfg.enabled) {
        await artifactSave(next);
      } else if (cfg.mode === "gsheet") {
        const patch = paths ? paths.map(path => ({
          path,
          value: getIn(next, path) ?? null
        })) : null;
        const r = await gsheetSave(cfg, next, patch, sheetUpdatedRef.current);
        if (r.stale) {
          // 그 사이 다른 사람이 저장했다 — 서버가 합쳐 두었으니 잠시 후 전체를 다시 받아 화면을 맞춘다
          sheetUpdatedRef.current = null;
          setTimeout(() => {
            refreshRef.current && refreshRef.current();
          }, 3200);
        } else {
          sheetUpdatedRef.current = r.updatedAt || sheetUpdatedRef.current;
        }
      } else {
        const token = await currentToken(cfg);
        await supabaseSave(cfg, next, token);
      }
      if (!optimistic) setData(next);
      dataRef.current = next;
      lastPersistTsRef.current = Date.now();
      setBackendError("");
      setAuthRequired(false);
      setStatus(lang === "en" ? "Saved" : "저장됨");
      setTimeout(() => setStatus(""), 1800);
      return true;
    } catch (e) {
      if (optimistic) setData(prev); // 저장 안 된 내용이 저장된 것처럼 보이지 않도록 되돌린다
      if (e.message === "AUTH_REQUIRED") {
        setAuthRequired(true);
        setStatus(lang === "en" ? "Sign in required" : "로그인이 필요합니다");
      } else {
        setBackendError(e.message || String(e));
        setStatus(lang === "en" ? "Save failed — please try again" : "저장 실패 — 다시 시도해주세요");
      }
      setTimeout(() => setStatus(""), 6000);
      return false;
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [lang, currentToken]);

  // 실시간 공유: 다른 기기·다른 사람이 저장한 내용을 주기적으로(및 화면 복귀 시 즉시) 다시 불러온다.
  // 직전에 내가 저장한 직후(3초 이내)는 경합을 피하기 위해 건너뛴다.
  const refreshFromStorage = useCallback(async () => {
    if (Date.now() - lastPersistTsRef.current < 3000) return;
    const cfg = backendRef.current;
    try {
      // Google 시트: 마지막 저장 시각이 그대로면 데이터 전체를 다시 받지 않는다 (휴대폰 데이터·속도 절약)
      if (cfg.enabled && cfg.mode === "gsheet" && sheetUpdatedRef.current) {
        try {
          const meta = await gsheetMeta(cfg);
          if (meta.updatedAt && meta.updatedAt === sheetUpdatedRef.current) {
            setBackendError("");
            setSyncedAt(Date.now());
            return;
          }
        } catch (e) {
          if (e.message !== "UNKNOWN_ACTION") throw e; // 예전 서버 — 전체 불러오기로 진행

      const res = await loadFromSource(cfg);
      if (res?.data) {
        const parsed = normalize(res.data);

      }
      setBackendError("");
      setAuthRequired(false);
      setSyncedAt(Date.now());

      if (e.message === "AUTH_REQUIRED") setAuthRequired(true);else if (cfg.enabled) setBackendError(e.message || String(e));
    }
  }, [loadFromSource]);
  refreshRef.current = refreshFromStorage;

  // 로그인
  const signIn = useCallback(async (email, password) => {

    const next = await authSignIn(cfg, email, password);

    try {
      const res = await supabaseLoad(cfg, next.accessToken);
      if (res?.data) {
        const parsed = normalize(res.data);
        setData(parsed);
        if (parsed.clients?.[0]) setSelectedClientId(parsed.clients[0].id);
      }
      setSyncedAt(Date.now());

  }, [saveSession]);

  // 로그아웃
  const signOut = useCallback(async () => {
    const cfg = backendRef.current;

      }

  // Google 스프레드시트 모드 — 암호 입력으로 잠금 해제
  const unlockWithPassphrase = useCallback(async (pass, remember) => {
    const cfg = resolveBackendConfig({

    });
    // 암호가 맞는지 실제로 백엔드에 확인 (틀리면 AUTH_REQUIRED 예외 발생)
    const res = await gsheetLoad(cfg);

  }, [backendOverride]);

  // 이 기기에만 저장된 데이터가 공유 데이터에 없는 내용을 가지고 있으면 합치기를 제안한다
  const checkLocalData = useCallback(async shared => {
    try {
      const local = await artifactLoad();
      if (!local?.data) return;
      const loc = normalize(local.data);
      if (!loc.clients.length) return;
      const result = mergeLocalIntoShared(shared || {
        clients: [],

      }, loc);

      });
    } catch (e) {
      // 이 기기에 저장된 데이터 없음

  }, []);
  const applyLocalImport = useCallback(async () => {

  const changeGasUrl = useCallback(async url => {

  const skipUnlock = useCallback(async () => {

    backendRef.current = {

      capitalGains: {},
      settings: {
        rate: DEFAULT_EXCHANGE_RATE,
        asOf: ""
      }
    });

    setAuth({

    });

    setBackendError("");
    setStatus("");
    setView("dashboard");
  }, [backendOverride]);

  // 백엔드 연결 설정 저장 — 저장 후 즉시 해당 백엔드에서 데이터를 다시 읽어온다
  const saveBackendConfig = useCallback(async cfgInput => {
    const next = {
      mode: cfgInput.mode || "supabase",

      gasUrl: (cfgInput.gasUrl || "").trim(),

    };
    setBackendOverride(next);
    backendRef.current = resolveBackendConfig(next);
    try {
      await window.storage.set(BACKEND_CONFIG_KEY, JSON.stringify(next), true);
    } catch (e) {
      // 아티팩트 저장소가 없는 환경 — 이번 세션에만 적용됨
    }
    try {
      const res = await loadFromSource(backendRef.current);
      if (res?.data) {
        const parsed = normalize(res.data);
        setData(parsed);
        if (parsed.clients?.[0]) setSelectedClientId(parsed.clients[0].id);
      }
      setBackendError("");
      setAuthRequired(false);
      setSyncedAt(Date.now());
      setStatus(lang === "en" ? "Backend connected" : "백엔드 연결됨");
    } catch (e) {
      if (e.message === "AUTH_REQUIRED") {
        setAuthRequired(true);
        setStatus(lang === "en" ? "Connected — sign in required" : "연결됨 — 로그인이 필요합니다");
      } else {

  }, [lang, loadFromSource]);
  useEffect(() => {

    };

    window.addEventListener("focus", poll);
    return () => {
      clearInterval(interval);
      window.removeEventListener("visibilitychange", onVisible);
      window.removeEventListener("focus", poll);
    };
  }, [loaded, refreshFromStorage]);
  const addClient = async client => {
    const {
      password,
      ...info
    } = client;
    const id = uid();
    const next = {
      ...data,
      clients: [...data.clients, {
        id,
        ...info

    };
    setSelectedClientId(id);
    const ok = await persist(next, {
      paths: [["clients"]]

      ok: false
    };

        ok: true,
        passwordError: r.error
      };
    }
    return {
      ok: true
    };
  };
  const updateClient = async (id, patch) => {
    const next = {
      ...data,
      clients: data.clients.map(c => c.id === id ? {
        ...c,

      paths: [["clients"]]
    });
    return {
      ok: ok !== false
    };

  const removeClient = id => {
    const nextFilings = {
      ...data.filings
    };

    const nextCapitalGains = {
      ...data.capitalGains
    };
    delete nextCapitalGains[id];
    const next = {
      ...data,
      clients: data.clients.filter(c => c.id !== id),

    };

  };
  const addCapitalGain = (clientId, entry) => {

    }];

        ...data.capitalGains,

    });

  const removeCapitalGain = (clientId, id) => {

    const next = {
      ...data,
      capitalGains: {
        ...data.capitalGains,
        [clientId]: list
      }
    };

    });

  const updateSettings = patch => {

      ...data,
      settings: {
        ...data.settings,

      }
    };
    persist(next, {
      paths: [["settings"]]
    });
  };
  const saveFiling = (clientId, key, filing) => {
    const clientFilings = {
      ...(data.filings[clientId] || {})
    };

    const next = {
      ...data,
      filings: {
        ...data.filings,
        [clientId]: clientFilings
      }
    };
    return persist(next, {
      optimistic: false,
      paths: [["filings", clientId, key]]
    });

  // 관리자: 고객사 비밀번호 지정·변경 (빈 값이면 삭제). 서버에는 암호화된 값만 저장된다
  // ── 서버 부가 기능: Drive 사진 보관 · 변경 기록 · 백업 · 연간 일정 ──
  const serverOn = backend.enabled && backend.mode === "gsheet" && !backend.reviewMode;

    if (!cfg.enabled || cfg.mode !== "gsheet" || !dataUrl) return null;
    try {
      const r = await gasRequest(cfg, "uploadImage", {

      });

    });

  };
  const backupNow = async () => gasRequest(backendRef.current, "backupNow", {});
  const setAnnual = (clientId, year, itemId, value) => {

    };

    };else delete y[itemId];

    });
  };
  const setClientPassword = async (clientId, password) => {
    const cfg = backendRef.current;
    if (!cfg.enabled || cfg.mode !== "gsheet") {
      return {
        ok: false,
        error: lang === "en" ? "Client passwords need the shared server connection (not available in review mode)." : "고객사 비밀번호는 공유 서버에 연결된 상태에서만 지정할 수 있어요 (검토 모드에서는 불가)."
      };
    }

      setAuth(a => {

          ...a.access
        };
        if (password) access[clientId] = true;else delete access[clientId];
        return {
          ...a,
          access
        };
      });
      return {
        ok: true
      };
    } catch (e) {
      const m = e.message || String(e);
      const msg = {
        PASSWORD_TOO_SHORT: lang === "en" ? "Use at least 6 characters." : "비밀번호는 6자 이상으로 해 주세요.",
        PASSWORD_IS_ADMIN: lang === "en" ? "That is the office passphrase — choose another." : "관리자 암호와 같은 비밀번호는 쓸 수 없어요.",
        PASSWORD_DUPLICATE: lang === "en" ? "Another client already uses this password — choose another." : "다른 고객사가 이미 쓰는 비밀번호예요. 다른 비밀번호를 정해 주세요."
      }[m] || m;
      return {
        ok: false,
        error: msg
      };
    }
  };
  const selectedClient = data.clients.find(c => c.id === selectedClientId) || null;
  const mKey = monthKey(selectedYear, selectedMonth);
  const savedFiling = (data.filings[selectedClientId] || {})[mKey];
  // 저장된 신고서가 없을 때 만드는 기본값은 useMemo로 고정한다.
  // 매 렌더마다 새 객체를 만들면 입력 화면의 "변경 여부" 판단이 계속 초기화된다.
  const currentFiling = useMemo(() => {
    if (savedFiling) return savedFiling;
    const clientFilings = data.filings[selectedClientId] || {};
    return {
      revenue: "",
      expenses: "",
      purchase: "",
      employees: carryForwardEmployees(clientFilings, selectedYear, selectedMonth),
      // NSSF 가입 여부도 직전 신고서 설정을 이어받는다 (없으면 비대상으로 시작)
      nssfApplicable: carryForwardNssf(clientFilings, selectedYear, selectedMonth),

    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [savedFiling, selectedClientId, selectedYear, selectedMonth, data.settings?.rate]);

  // 화면 이동 — 저장하지 않은 편집이 있으면 먼저 확인
  const goView = v => {
